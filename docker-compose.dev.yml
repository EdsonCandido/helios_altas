services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  server:
    build:
      context: ./apps/server
      target: development
    command: ["npm", "run", "dev"]
    volumes:
      - ./apps/server:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:4200
      WEB_URL: http://localhost:4200
    networks:
      - default

  web:
    profiles:
      - compose-web
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - default

networks:
  proxy:
    external: false
    name: helios_proxy_dev
